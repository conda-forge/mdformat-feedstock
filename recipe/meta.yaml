{% set name = "mdformat" %}
{% set version = "1.0.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/mdformat-{{ version }}.tar.gz

  sha256: 4954045fcae797c29f86d4ad879e43bb151fa55dbaf74ac6eaeacf1d45bb3928

build:
  number: 0
  noarch: python
  entry_points:
    - mdformat = mdformat.__main__:run
  script: {{ PYTHON }} -m pip install . -vv

# Check [project.dependencies] in
#   https://github.com/executablebooks/mdformat/blob/master/pyproject.toml
requirements:
  host:
    - python {{ python_min }}
    - setuptools >=69
    - pip
  run:
    - python >={{ python_min }}
    - markdown-it-py >=1,<5
    - tomli >=1.1.0
    - importlib-metadata >=3.6.0

test:
  imports:
    - mdformat
    - mdformat.codepoints
  commands:
    - pip check
    - mdformat --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/executablebooks/mdformat
  summary: CommonMark compliant Markdown formatter
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - timkpaine
    - maresb
